name: Linux Packing

on: workflow_call


jobs:
  linux-packing:
    name: Linux Packing
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Shanghai'   # 为所有步骤设置时区

    steps:
      - name: Clone Repository
        uses: actions/checkout@v3
        with:
          repository: jadehh/jade_tools
          ref: main
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0           # 获取完整的历史记录，而不只是最新提交
          fetch-tags: true         # 显式告诉 Action 去获取所有标签

      - name: Extract Version from Tag
        id: get_version
        run: |
          tag=${GITHUB_REF#refs/tags/}
          echo "tag_name=${tag}" >> $GITHUB_OUTPUT
          # 提取仓库名称（去掉 -v 及后面的版本号）
          repo_name=$(echo "${tag}" | sed 's/-v[0-9].*//')
          echo "repo_name=${repo_name}" >> $GITHUB_OUTPUT

      - name: Build Dynamic Library Jade Tools Slim  for Linux
        run: |
          echo "Build Dynamic Library Jade Tools Slim  for Linux 构建开始时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          docker run  --rm  --platform linux/amd64 --name build_shared -u $(id -u):$(id -g) -v  ${{ github.workspace }}:/app  \
                      -w /app ghcr.io/jadehh/jade_tools:1.0.2-slim-devel-ubuntu18.04 bash -c "
              mkdir -p build-jade-tools-slim-linux && cd build-jade-tools-slim-linux && \
              cmake ..  \
                -D CMAKE_BUILD_TYPE=Release \
                -D CMAKE_INSTALL_PREFIX=../jade_tools-slim-linux \
                -D USE_OPENCV_4=OFF \
                -D SQLITE3_DIR=/usr/include \
                -D OPENSSL_DIR=/usr/include \
                -D BREAKPAD_DIR=/usr/local/include/breakpad \
                -D SPDLOG_DIR=/usr/local/include/spdlog \
                -D OPENCV_DIR=/usr/local/opencv \
                -D MODBUS_DIR=/usr/include \
                -D PUGIXML_DIR=/usr/include && \
              make -j $(nproc) && make install  && rm -r ../build-jade-tools-slim-linux"
          echo "Build Dynamic Library Jade Tools Slim  for Linux 构建结束时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          docker rmi ghcr.io/jadehh/jade_tools:1.0.2-slim-devel-ubuntu18.04 


      - name: Build Dynamic Library Jade Tools Cpu  for Linux
        run: |
          echo "Build Dynamic Library Jade Tools Cpu  for Linux 构建开始时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          docker run  --rm  --name build_shared -u $(id -u):$(id -g) -v  ${{ github.workspace }}:/app  \
                      -w /app ghcr.io/jadehh/jade_tools:1.0.2-cpu-devel-ubuntu18.04 bash -c "
              mkdir -p build-jade-tools-cpu-linux && cd build-jade-tools-cpu-linux && \
              cmake ..  \
                -D CMAKE_BUILD_TYPE=Release \
                -D CMAKE_INSTALL_PREFIX=../jade_tools-cpu-linux \
                -D USE_OPENCV_4=ON \
                -D USE_OPENCV_CUDA=OFF \
                -D SQLITE3_DIR=/usr/include \
                -D OPENSSL_DIR=/usr/include \
                -D HASP_ADAPTER_DIR=/usr/local/include  \
                -D BREAKPAD_DIR=/usr/local/include/breakpad \
                -D SPDLOG_DIR=/usr/local/include/spdlog \
                -D OPENCV_DIR=/usr/local/opencv \
                -D MODBUS_DIR=/usr/include \
                -D PUGIXML_DIR=/usr/include && \
              make -j $(nproc) && make install  && rm -r ../build-jade-tools-cpu-linux"
          echo "Build Dynamic Library Jade Tools Cpu  for Linux 构建结束时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          docker rmi ghcr.io/jadehh/jade_tools:1.0.2-cpu-devel-ubuntu18.04 
          
      - name: Build Dynamic Library Jade Tools CUDA10  for Linux
        run: |
          echo "Build Dynamic Library Jade Tools CUDA10  for Linux 构建开始时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          docker run  --rm  --name build_shared -u $(id -u):$(id -g) -v  ${{ github.workspace }}:/app  \
                      -w /app ghcr.io/jadehh/jade_tools:1.0.2-cuda10-devel-ubuntu18.04 bash -c "
                mkdir -p build-jade-tools-cuda10-linux && cd build-jade-tools-cuda10-linux && \
                cmake ..  \
                -D CMAKE_BUILD_TYPE=Release \
                -D CMAKE_INSTALL_PREFIX=../jade_tools-cuda10-linux \
                -D USE_OPENCV_4=ON \
                -D SQLITE3_DIR=/usr/include \
                -D OPENSSL_DIR=/usr/include \
                -D HASP_ADAPTER_DIR=/usr/local/include  \
                -D BREAKPAD_DIR=/usr/local/include/breakpad \
                -D SPDLOG_DIR=/usr/local/include/spdlog \
                -D OPENCV_DIR=/usr/local/opencv \
                -D MODBUS_DIR=/usr/include \
                -D PUGIXML_DIR=/usr/include && \
                make -j $(nproc) && make install  && rm -r ../build-jade-tools-cuda10-linux"
          echo "Build Dynamic Library Jade Tools CUDA10  for Linux 构建结束时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          docker rmi ghcr.io/jadehh/jade_tools:1.0.2-cuda10-devel-ubuntu18.04 

      - name: Build Dynamic Library Jade Tools CUDA11  for Linux
        run: |
          echo "Build Dynamic Library Jade Tools CUDA11  for Linux 构建开始时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          docker run  --rm  --name build_shared -u $(id -u):$(id -g) -v  ${{ github.workspace }}:/app  \
                      -w /app ghcr.io/jadehh/jade_tools:1.0.2-cuda11-devel-ubuntu22.04 bash -c "
                mkdir -p build-jade-tools-cuda11-linux && cd build-jade-tools-cuda11-linux && \
                cmake ..  \
                -D CMAKE_BUILD_TYPE=Release \
                -D CMAKE_INSTALL_PREFIX=../jade_tools-cuda11-linux \
                -D USE_OPENCV_4=ON \
                -D SQLITE3_DIR=/usr/include \
                -D OPENSSL_DIR=/usr/include \
                -D HASP_ADAPTER_DIR=/usr/local/include  \
                -D BREAKPAD_DIR=/usr/local/include/breakpad \
                -D SPDLOG_DIR=/usr/local/include/spdlog \
                -D OPENCV_DIR=/usr/local/opencv \
                -D MODBUS_DIR=/usr/include \
                -D PUGIXML_DIR=/usr/include && \
                make -j $(nproc) && make install  && rm -r ../build-jade-tools-cuda11-linux"
          echo "Build Dynamic Library Jade Tools CUDA11  for Linux 构建结束时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          docker rmi ghcr.io/jadehh/jade_tools:1.0.2-cuda11-devel-ubuntu22.04 

      - name: Tar Jade Tools
        run: |
          # 压缩 slim 包
          cd jade_tools-slim-linux && tar -czvf ../${{ steps.get_version.outputs.tag_name }}-slim-linux.tar.gz . && cd ..
          cd jade_tools-slim-linux/lib && tar -czvf ../${{ steps.get_version.outputs.tag_name }}-runtime-slim-linux.tar.gz . && cd ..
          md5sum ${{ steps.get_version.outputs.tag_name }}-runtime-slim-linux.tar.gz > ${{ steps.get_version.outputs.tag_name }}-runtime-slim-linux.tar.gz.md5
          # 压缩 cpu 包
          cd jade_tools-cpu-linux && tar -czvf ../${{ steps.get_version.outputs.tag_name }}-cpu-linux.tar.gz . && cd ..
          cd jade_tools-cpu-linux/lib && tar -czvf ../${{ steps.get_version.outputs.tag_name }}-runtime-cpu-linux.tar.gz . && cd ..
          md5sum ${{ steps.get_version.outputs.tag_name }}-runtime-cpu-linux.tar.gz > ${{ steps.get_version.outputs.tag_name }}-runtime-cpu-linux.tar.gz.md5
          # 压缩 cuda10 包
          cd jade_tools-cuda10-linux && tar -czvf ../${{ steps.get_version.outputs.tag_name }}-cuda10-linux.tar.gz . && cd ..
          cd jade_tools-cuda10-linux/lib && tar -czvf ../${{ steps.get_version.outputs.tag_name }}-runtime-cuda10-linux.tar.gz . && cd ..
          md5sum ${{ steps.get_version.outputs.tag_name }}-runtime-cuda10-linux.tar.gz > ${{ steps.get_version.outputs.tag_name }}-runtime-cuda10-linux.tar.gz.md5
          # 压缩 cuda11 包
          cd jade_tools-cuda11-linux && tar -czvf ../${{ steps.get_version.outputs.tag_name }}-cuda11-linux.tar.gz . && cd ..
          cd jade_tools-cuda11-linux/lib && tar -czvf ../${{ steps.get_version.outputs.tag_name }}-runtime-cuda11-linux.tar.gz . && cd ..
          md5sum ${{ steps.get_version.outputs.tag_name }}-runtime-cuda11-linux.tar.gz > ${{ steps.get_version.outputs.tag_name }}-runtime-cuda11-linux.tar.gz.md5

      - name: Generate Linux Download Information
        run: |
          # 如果不存在使用则新建
          cmake -D OUTPUT_FILE=RELEASE_NOTES.md -P cmake/extractChangelog.cmake
          # jade tools slim runtime 信息
          file_slim="${{ steps.get_version.outputs.tag_name }}-runtime-slim-linux.tar.gz"
          md5_slim=$(cat "${file_slim}.md5" | awk '{print $1}')
          download_url_slim="https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag_name }}/$file_slim"
          # jade tools cpu runtime 信息
          file_cpu="${{ steps.get_version.outputs.tag_name }}-runtime-cpu-linux.tar.gz"
          md5_cpu=$(cat "${file_cpu}.md5" | awk '{print $1}')
          download_url_cpu="https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag_name }}/$file_cpu"
          # jade tools cuda10 runtime 信息
          file_cuda10="${{ steps.get_version.outputs.tag_name }}-runtime-cuda10-linux.tar.gz"
          md5_cuda10=$(cat "${file_cuda10}.md5" | awk '{print $1}')
          download_url_cuda10="https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag_name }}/$file_cuda10"
          # jade tools cuda11 runtime 信息
          file_cuda11="${{ steps.get_version.outputs.tag_name }}-runtime-cuda11-linux.tar.gz"
          md5_cuda11=$(cat "${file_cuda11}.md5" | awk '{print $1}')
          download_url_cuda11="https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag_name }}/$file_cuda11"
          # 生成 JSON 格式的下载信息
          cat > linux.json << JSONEOF
          {
          "platform": "linux",
          "tag_name": "${{ steps.get_version.outputs.tag_name }}",
          "packages": [
            {
              "name": "slim",
              "file": "${file_slim}",
              "md5": "${md5_slim}",
              "download_url": "${download_url_slim}"
            },
            {
              "name": "cpu",
              "file": "${file_cpu}",
              "md5": "${md5_cpu}",
              "download_url": "${download_url_cpu}"
            },
            {
              "name": "cuda10",
              "file": "${file_cuda10}",
              "md5": "${md5_cuda10}",
              "download_url": "${download_url_cuda10}"
            },
            {
              "name": "cuda11",
              "file": "${file_cuda11}",
              "md5": "${md5_cuda11}",
              "download_url": "${download_url_cuda11}"
            }
          ]
          }
          JSONEOF

      - name: Upload Linux Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "${{ steps.get_version.outputs.tag_name }}"
          body_path: "RELEASE_NOTES.md"
          files: |
            ${{ steps.get_version.outputs.tag_name }}-slim-linux.tar.gz
            ${{ steps.get_version.outputs.tag_name }}-runtime-slim-linux.tar.gz
            ${{ steps.get_version.outputs.tag_name }}-cpu-linux.tar.gz
            ${{ steps.get_version.outputs.tag_name }}-runtime-cpu-linux.tar.gz
            ${{ steps.get_version.outputs.tag_name }}-cuda10-linux.tar.gz
            ${{ steps.get_version.outputs.tag_name }}-runtime-cuda10-linux.tar.gz
            ${{ steps.get_version.outputs.tag_name }}-cuda11-linux.tar.gz
            ${{ steps.get_version.outputs.tag_name }}-runtime-cuda11-linux.tar.gz
            linux.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}